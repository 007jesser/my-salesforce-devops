trigger:
  branches:
    include:
      - main
      - dev
      - feature/*

pool:
  vmImage: 'windows-latest'

variables:
  nodeVersion: '18.x'
  SCRATCH_ORG_ALIAS: 'ci-scratch-org'
  SCRATCH_DEF_FILE: 'config/project-scratch-def.json'
  PMD_RULESET: 'rulesets/apex/quickstart.xml'
  COVERAGE_THRESHOLD: 75

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '$(nodeVersion)'
  displayName: 'Install Node.js'

- task: PowerShell@2
  displayName: 'Cleanup existing sfdx if present'
  inputs:
    targetType: 'inline'
    script: |
      $ErrorActionPreference = 'Stop'
      $sfdxCmd = Get-Command sfdx -ErrorAction SilentlyContinue
      if ($sfdxCmd) {
        Write-Host "sfdx found at: $($sfdxCmd.Path) - attempting best-effort removal"
        try { Remove-Item $sfdxCmd.Path -Force -ErrorAction SilentlyContinue } catch {}
      } else {
        Write-Host "No sfdx command found in PATH"
      }

- script: |
    npm install -g @salesforce/cli --no-fund --no-audit
    sf --version
  displayName: 'Install Salesforce CLI'

- checkout: self

# SECRET SCAN (lightweight)
- task: PowerShell@2
  displayName: 'Secret scan (common patterns)'
  inputs:
    targetType: 'inline'
    script: |
      $ErrorActionPreference = 'Continue'
      Write-Host "Running simple repo secret-scan..."
      $patterns = @(
        'BEGIN RSA PRIVATE KEY',
        'BEGIN PRIVATE KEY',
        'AWS_SECRET_ACCESS_KEY',
        'aws_secret_access_key',
        'AWS_ACCESS_KEY_ID',
        'AKIA[A-Z0-9]{16}',
        'google(-|_)?api',
        'password\s*[:=]\s*\S+',
        'oauth_token',
        'ghp_[A-Za-z0-9]{36}',
        '-----BEGIN EC PRIVATE KEY-----'
      )
      $matches = @()
      Get-ChildItem -Recurse -File -Force -ErrorAction SilentlyContinue | Where-Object { $_.Length -lt 5MB } | ForEach-Object {
        try {
          $content = Get-Content -Raw -LiteralPath $_.FullName -ErrorAction Stop
          foreach ($p in $patterns) {
            if ($content -match $p) { $matches += "$($_.FullName) : pattern [$p]" }
          }
        } catch {}
      }
      if ($matches.Count -gt 0) {
        Write-Error "Potential secrets found:`n$($matches -join "`n")"
        exit 1
      } else {
        Write-Host "No high-confidence patterns found."
      }

# PMD (if available)
- script: |
    echo "Running PMD Static Code Analysis"
    if (Test-Path pmd-bin-7.16.0\bin\pmd.bat) (
      pmd-bin-7.16.0\bin\pmd.bat check -d force-app -R $(PMD_RULESET) -f xml -r pmd-report.xml
    ) else (
      echo "PMD binary not found - skipping PMD."
    )
  displayName: 'Run PMD (if available)'

# npm audit
- script: |
    echo "Install deps & run npm audit (SCA)"
    if (Test-Path package.json) (
      npm ci
      npm audit --audit-level=moderate || (echo "Vulnerabilities found - failing build" & exit 1)
    ) else (
      echo "No package.json - skipping npm audit"
    )
  displayName: 'npm audit (dependency scan)'

# Detect whether DevHub auth exists on the agent (do NOT use secure-file)
- task: PowerShell@2
  displayName: 'Detect DevHub auth presence (will skip auth steps if missing)'
  inputs:
    targetType: 'inline'
    script: |
      $path = Join-Path $env:USERPROFILE ".sfdx\devhub.json"
      if (Test-Path $path) {
        Write-Host "DevHub auth found at $path"
        Write-Host "##vso[task.setvariable variable=DEVHUB_AVAILABLE]true"
      } else {
        Write-Host "DevHub auth NOT found. Org-related steps will be skipped."
        Write-Host "##vso[task.setvariable variable=DEVHUB_AVAILABLE]false"
      }

# Create scratch org -- only when DevHub auth is present
- script: |
    sf org create scratch --definition-file $(SCRATCH_DEF_FILE) --alias $(SCRATCH_ORG_ALIAS) --set-default --target-dev-hub devhub
  displayName: 'Create Scratch Org'
  condition: and(succeeded(), eq(variables['DEVHUB_AVAILABLE'], 'true'))

# Run Apex tests -- only when DevHub auth is present
- script: |
    echo Running Apex tests
    sf apex run test --target-org $(SCRATCH_ORG_ALIAS) --wait 10 --test-level RunLocalTests --result-format junit --code-coverage --output-file test-results.xml
  displayName: 'Run Apex Tests'
  condition: and(succeeded(), eq(variables['DEVHUB_AVAILABLE'], 'true'))

- task: PublishTestResults@2
  condition: and(succeededOrFailed(), eq(variables['DEVHUB_AVAILABLE'], 'true'))
  inputs:
    testResultsFiles: '**/test-results.xml'
    testRunTitle: 'Apex Test Results'
    failTaskOnFailedTests: true

# Coverage gate (runs regardless; will skip if no test-results.xml)
- task: PowerShell@2
  displayName: 'Coverage gate (fail if < $(COVERAGE_THRESHOLD)%)'
  inputs:
    targetType: 'inline'
    script: |
      $ErrorActionPreference = 'Stop'
      $threshold = [double]$(COVERAGE_THRESHOLD)
      $file = Get-ChildItem -Path . -Filter test-results.xml -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
      if (-not $file) {
        Write-Host "test-results.xml not found - skipping coverage gate."
        exit 0
      }
      $text = Get-Content -Raw $file.FullName
      $m = [regex]::Match($text, '(\d+(\.\d+)?)\s*%')
      if ($m.Success) {
        $cov = [double]$m.Groups[1].Value
        Write-Host "Found coverage: $cov %"
        if ($cov -lt $threshold) { Write-Error "Code coverage $cov% < $threshold%"; exit 1 } else { Write-Host "Coverage OK: $cov%"; exit 0 }
      }
      $m2 = [regex]::Match($text, '(?:coverage|percent|coveragePercent|coveragePercentage)\s*=\s*["'']?(\d+(\.\d+)?)')
      if ($m2.Success) {
        $cov = [double]$m2.Groups[1].Value
        Write-Host "Found coverage via attribute: $cov"
        if ($cov -lt $threshold) { Write-Error "Code coverage $cov% < $threshold%"; exit 1 } else { Write-Host "Coverage OK: $cov%"; exit 0 }
      }
      Write-Host "Coverage number not found in test-results.xml, skipping coverage gate."
      exit 0

# Deploy to scratch org -- only when DevHub auth is present
- script: |
    echo "Deploying source to Scratch Org"
    sf deploy metadata --target-org $(SCRATCH_ORG_ALIAS) --wait 10
  displayName: 'Deploy to Scratch Org'
  condition: and(succeeded(), eq(variables['DEVHUB_AVAILABLE'], 'true'))

# Publish reports (pmd-report.xml, test-results.xml) if present
- task: PublishBuildArtifacts@1
  condition: succeededOrFailed()
  inputs:
    PathtoPublish: |
      pmd-report.xml
      test-results.xml
    ArtifactName: 'ci-reports'
    publishLocation: 'Container'
  displayName: 'Publish CI reports'

# Delete scratch org -- only when DevHub auth is present (always run if auth available)
- script: |
    echo "Cleanup: delete scratch org"
    sf org delete scratch --target-org $(SCRATCH_ORG_ALIAS) --noprompt
  displayName: 'Delete Scratch Org'
  condition: and(always(), eq(variables['DEVHUB_AVAILABLE'], 'true'))
