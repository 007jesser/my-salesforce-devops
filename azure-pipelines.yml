trigger:
    branches:
        include:
            - main
            - dev
            - feature/*

pool:
    name: Default

variables:
    SCRATCH_ORG_ALIAS: 'ci-scratch-org'
    SCRATCH_DEF_FILE: 'config/project-scratch-def.json'
    PMD_RULESET: 'rulesets/apex/quickstart.xml'

steps:
    # -----------------
    # 1. Install Node.js
    # -----------------
    - task: NodeTool@0
      inputs:
          versionSpec: '20.x'
      displayName: 'Install Node.js'

    # -----------------
    # 2. Clean old Salesforce CLI
    # -----------------
    - task: PowerShell@2
      displayName: 'Clean existing Salesforce CLI files'
      inputs:
          targetType: 'inline'
          script: |
              $sfdxPath = "$(Agent.ToolsDirectory)\node\18.20.8\x86\sfdx.cmd"
              $sfdxFolder = "$(Agent.ToolsDirectory)\node\18.20.8\x86\node_modules\sfdx-cli"
              if (Test-Path $sfdxPath) { Remove-Item $sfdxPath -Force -ErrorAction SilentlyContinue }
              if (Test-Path $sfdxFolder) { Remove-Item $sfdxFolder -Recurse -Force -ErrorAction SilentlyContinue }

    # -----------------
    # 3. Install Salesforce CLI
    # -----------------
    - script: |
          npm install -g @salesforce/cli --force
          sf --version
      displayName: 'Install Salesforce CLI'

    - checkout: self

    # -----------------
    # 4. Restore DevHub Auth
    # -----------------
    - task: DownloadSecureFile@1
      name: fetchDevhubAuth
      inputs:
          secureFile: 'jesser.sallemi18@resourceful-koala-vbyb01.com.json'

    - task: PowerShell@2
      displayName: 'Restore DevHub Auth as devhub.json'
      inputs:
          targetType: 'inline'
          script: |
              $authFilename = "jesser.sallemi18@resourceful-koala-vbyb01.com.json"
              $destinationDir = "$env:USERPROFILE\.sfdx"
              if (!(Test-Path $destinationDir)) { New-Item -ItemType Directory -Path $destinationDir -Force | Out-Null }
              Copy-Item "$(Agent.TempDirectory)\$authFilename" "$destinationDir\devhub.json" -Force

    # -----------------
    # 5. Create Scratch Org
    # -----------------
    - script: |
          sf org create scratch --definition-file $(SCRATCH_DEF_FILE) --alias $(SCRATCH_ORG_ALIAS) --set-default --target-dev-hub devhub
      displayName: 'Create Scratch Org'
    #
    # 6. Secret scan - non-interactive trufflehog
    #
    - script: |
          npm install -g trufflehog
          trufflehog filesystem --no-update --fail . || echo "No secrets found"
      displayName: 'Secret Scan'
      continueOnError: true

    #
    #7. npm audit with lockfile generation
    #
    - checkout: self

    - script: |
          npm ci
      displayName: 'Install npm dependencies'

    - script: |
          echo "📦 Generating package-lock.json for audit..."
          npm install --package-lock-only --engine-strict=false
          echo "📦 Running npm audit..."
          npm audit --audit-level=high || echo "Audit completed - non-blocking"
      displayName: 'Node Dependency Audit'
      continueOnError: true
    # -----------------
    # 7.1 Run Jest Tests with Coverage
    # -----------------
    - script: |
          echo "🧪 Running Jest tests with coverage..."
          npx jest --coverage --ci --reporters=default --reporters=jest-junit
      displayName: 'Run Jest Tests with Coverage'
      continueOnError: true

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
          testResultsFiles: '**/junit.xml'
          testRunTitle: 'Jest Unit Test Results'

    - task: PublishCodeCoverageResults@2
      condition: succeededOrFailed()
      inputs:
          codeCoverageTool: 'Cobertura'
          summaryFileLocation: 'coverage/cobertura-coverage.xml'
          reportDirectory: 'coverage'

    # -----------------
    # Run ESLint
    # -----------------
    - script: |
          echo "🔍 Running ESLint..."
          npx eslint . --ext .js,.jsx,.ts,.tsx || echo "Lint warnings found"
      displayName: 'Run ESLint'
      continueOnError: true

    # -----------------
    # Run OWASP Dependency Check
    # -----------------
    - script: |
          echo "🔐 Running OWASP Dependency-Check..."
          npx audit-ci --high
      displayName: 'OWASP Dependency Security Check'
      continueOnError:
          true

          # -----------------
    # Run Snyk Security Scan
    # -----------------
    - script: |
          echo "🔐 Running Snyk Scan..."
          npx snyk test
      displayName: 'Run Snyk Security Scan'
      continueOnError: true
    # -----------------
    # Run Lighthouse CI
    # -----------------
    - script: |
          echo "📊 Running Lighthouse CI..."
          npx lhci autorun || echo "Lighthouse issues found"
      displayName: 'Run Lighthouse CI'
      continueOnError: true
    # -----------------
    # Run Prettier Check
    # -----------------
    - script: |
          echo "🎨 Checking code format with Prettier..."
          npx prettier --check .
      displayName: 'Run Prettier Format Check'
      continueOnError: true

    # -----------------
    # 8. Static Code Analysis (PMD + Security Rules)
    # -----------------
    - script: |
          echo "🔍 Running PMD Static Code + Security Analysis"
          pmd-bin\pmd-bin-7.16.0\bin\pmd.bat check -d force-app -R $(PMD_RULESET) -f text
      displayName: 'Run PMD Code & Security Analysis'
      continueOnError: true

    # -----------------
    # 9. Run Apex Tests (Non-blocking for Dev)
    # -----------------
    - script: |
          echo "🧪 Running Apex tests..."
          sf apex run test --target-org myhuborg --wait 2 --test-level RunLocalTests --code-coverage --result-format human
      displayName: 'Run Apex Tests'
      continueOnError: true

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
          testResultsFiles: '**/test-results.xml'
          testRunTitle: 'Apex Test Results'

    # -----------------
    # 10. Deploy to Scratch Org
    # -----------------
    - script: |
          echo "🚀 Deploying source to Scratch Org"
          sf deploy metadata --target-org $(SCRATCH_ORG_ALIAS) --wait 10
      displayName: 'Deploy to Scratch Org'

    # -----------------
    # 11. Assign Permission Sets
    # -----------------
    - script: |
          echo "🎯 Assigning permission sets..."
          sf org assign permset --name ebikes --target-org $(SCRATCH_ORG_ALIAS)
          sf org assign permset --name Walkthroughs --target-org $(SCRATCH_ORG_ALIAS)
      displayName: 'Assign Permission Sets'

    # -----------------
    # 12. Import Sample Data
    # -----------------
    - script: |
          echo "📥 Importing sample data..."
          sf data tree import -p ./data/sample-data-plan.json --target-org $(SCRATCH_ORG_ALIAS)
      displayName: 'Import Sample Data'

    # -----------------
    # 13. Publish Experience Cloud Site
    # -----------------
    - script: |
          echo "🌐 Publishing Experience Cloud site..."
          sf community publish --name "E-Bikes" --target-org $(SCRATCH_ORG_ALIAS)
      displayName: 'Publish Experience Cloud Site'

    # -----------------
    # 14. Deploy Guest Profile Metadata
    # -----------------
    - script: |
          echo "🔐 Deploying guest profile metadata..."
          sf project deploy start --metadata-dir=guest-profile-metadata --wait 10 --target-org $(SCRATCH_ORG_ALIAS)
      displayName: 'Deploy Guest Profile Metadata'
